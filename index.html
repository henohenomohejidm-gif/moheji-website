<!DOCTYPE html>

  <meta charset="UTF-8">

  <style>
    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: #05070a;
      color: #e8edf3;
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::selection {
      background: #7c3aed;
      color: #ffffff;
    }


    /* =========================================================
       BACKGROUND
    ========================================================= */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -2;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        );

      background-size: 50px 50px;
    }

    body::after {
      content: "";
      position: fixed;
      width: 700px;
      height: 700px;
      top: -300px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: -1;

      background: radial-gradient(
        circle,
        rgba(91, 108, 255, 0.10),
        transparent 65%
      );
    }


    /* =========================================================
       GLOBAL
    ========================================================= */

    .container {
      width: min(1160px, 92%);
      margin: 0 auto;
    }

    .mono {
      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        Menlo,
        monospace;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      border-bottom: 1px solid rgba(255,255,255,0.08);

      background: rgba(5, 7, 10, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    nav {
      min-height: 72px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand-mark {
      width: 32px;
      height: 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 8px;

      background: #0c1016;

      font-size: 12px;

      box-shadow:
        inset 0 0 20px rgba(255,255,255,0.03);
    }

    .brand span {
      color: #77808c;
      font-weight: 400;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 12px;
    }

    .nav-links a {
      color: #8c96a3;
      transition: 0.2s ease;
    }

    .nav-links a:hover {
      color: #ffffff;
    }

    .nav-status {
      display: flex;
      align-items: center;
      gap: 7px;

      padding: 7px 11px;

      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;

      color: #9ba5b2;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 11px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #36d399;

      box-shadow: 0 0 10px rgba(54,211,153,0.8);
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      position: relative;

      padding: 120px 0 100px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 0.85fr;
      gap: 70px;

      align-items: center;
    }

    .terminal-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 24px;

      color: #7d8794;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 12px;
    }

    .terminal-label::before {
      content: ">";
      color: #7c3aed;
      font-weight: 900;
    }

    .hero h1 {
      max-width: 850px;

      font-size: clamp(58px, 9vw, 110px);
      line-height: 0.9;

      letter-spacing: -6px;

      font-weight: 900;
    }

    .hero h1 .dim {
      display: block;

      color: #59616c;

      font-size: 0.48em;
      letter-spacing: -2px;

      margin-top: 20px;
    }

    .hero-description {
      max-width: 610px;

      margin-top: 30px;

      color: #89929e;

      font-size: 17px;
    }

    .hero-description strong {
      color: #e8edf3;
      font-weight: 600;
    }


    /* =========================================================
       BUTTONS
    ========================================================= */

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;

      margin-top: 34px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      padding: 12px 18px;

      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;

      background: #0b0f14;

      color: #cbd2da;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 12px;
      font-weight: 700;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);

      border-color: rgba(255,255,255,0.3);

      background: #11161d;
    }

    .button.primary {
      border-color: rgba(124,58,237,0.7);

      background: #7c3aed;
      color: #ffffff;

      box-shadow:
        0 0 30px rgba(124,58,237,0.18);
    }

    .button.primary:hover {
      background: #8b5cf6;
      border-color: #8b5cf6;
    }


    /* =========================================================
       HERO TERMINAL
    ========================================================= */

    .terminal {
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 12px;

      background: rgba(9, 12, 17, 0.88);

      box-shadow:
        0 30px 100px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.03);

      overflow: hidden;
    }

    .terminal-top {
      height: 42px;

      display: flex;
      align-items: center;

      padding: 0 15px;

      border-bottom: 1px solid rgba(255,255,255,0.07);

      background: #0b0f14;
    }

    .terminal-dots {
      display: flex;
      gap: 6px;
    }

    .terminal-dots i {
      width: 8px;
      height: 8px;

      display: block;

      border-radius: 50%;

      background: #303640;
    }

    .terminal-title {
      margin: auto;

      color: #626b76;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 10px;
    }

    .terminal-body {
      padding: 28px;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 12px;
      line-height: 2;
    }

    .line {
      display: flex;
      gap: 10px;
    }

    .prompt {
      color: #7c3aed;
    }

    .command {
      color: #d8dee6;
    }

    .output {
      color: #6f7a87;
    }

    .value {
      color: #b7c1cc;
    }

    .green {
      color: #36d399;
    }

    .purple {
      color: #a78bfa;
    }

    .terminal-cursor {
      display: inline-block;

      width: 7px;
      height: 14px;

      margin-left: 4px;

      vertical-align: -2px;

      background: #7c3aed;

      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }


    /* =========================================================
       SECTIONS
    ========================================================= */

    section {
      padding: 100px 0;

      border-top: 1px solid rgba(255,255,255,0.07);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      margin-bottom: 45px;
    }

    .section-number {
      color: #59616c;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 11px;
    }

    .section-title {
      margin-top: 8px;

      font-size: 34px;
      letter-spacing: -1.5px;
    }

    .section-description {
      max-width: 500px;

      color: #747e8b;

      font-size: 14px;
    }


    /* =========================================================
       ABOUT
    ========================================================= */

    .about-grid {
      display: grid;

      grid-template-columns: 1.2fr 0.8fr;

      gap: 30px;
    }

    .panel {
      padding: 30px;

      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 10px;

      background: rgba(10,14,19,0.72);

      transition: 0.25s ease;
    }

    .panel:hover {
      border-color: rgba(255,255,255,0.17);

      transform: translateY(-2px);
    }

    .panel p {
      color: #87919d;

      font-size: 15px;

      margin-bottom: 18px;
    }

    .panel p:last-child {
      margin-bottom: 0;
    }

    .panel p strong {
      color: #d9e0e7;
    }


    /* =========================================================
       SYSTEM CARDS
    ========================================================= */

    .system-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 12px;
    }

    .system-card {
      padding: 22px;

      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 9px;

      background: #090d12;
    }

    .system-card-label {
      color: #5e6874;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 10px;
      text-transform: uppercase;

      letter-spacing: 1px;
    }

    .system-card-value {
      margin-top: 10px;

      color: #dce2e8;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 13px;
      font-weight: 700;
    }

    .online {
      color: #36d399;
    }
